name: Sync plugin outputs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write

jobs:
  sync:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    steps:
      - name: ctx
        run: >-
          jq -c '{event:.workflow_run.event,head_branch:.workflow_run.head_branch,
          head_sha:.workflow_run.head_sha,
          head_repo:.workflow_run.head_repository.full_name,
          fork:.workflow_run.head_repository.fork,
          conclusion:.workflow_run.conclusion}' "$GITHUB_EVENT_PATH"
      - name: Checkout triggering sha (same as target)
        id: co
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: inspect
        if: always()
        run: |
          echo "CHECKOUT_OUTCOME=${{ steps.co.outcome }}"
          echo "GITHUB_SHA=$GITHUB_SHA"
          if [ -f PWNED.txt ]; then echo "TREE=attacker-or-base marker: $(cat PWNED.txt)"; fi
          git rev-parse HEAD 2>/dev/null || true
